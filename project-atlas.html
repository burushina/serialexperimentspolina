  /* frame: transparent by default. placeholder (border+grain) only while

  }

  .frame pre { margin:0; position:absolute; inset:0; padding:3px 5px;

<script>
/* Frames start with class .is-empty and a dashed grain placeholder.
   Each .frame may carry data-src (and optional data-poster). We create the
   <img>; on load we drop the placeholder (border + grain disappear); on error
   we keep the placeholder so nothing breaks visually. Drop a real folder named
   images/ next to these files and the photos appear with no frames. */
(() => {
  const G = ['.', ':', '\u00B7', '+', '~', '\u00B0'];
  function grain(f) {
    let pre = f.querySelector('pre');
    if (!pre) { pre = document.createElement('pre'); f.prepend(pre); }
    const cols = Math.max(8, Math.floor(f.clientWidth / 6.1)),
          rows = Math.max(4, Math.floor(f.clientHeight / 13.5));
    let out = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) out += Math.random() < 0.045 ? G[(Math.random()*G.length)|0] : ' ';
      out += '\n';
    }
    pre.textContent = out;
    f.querySelectorAll('.c').forEach(n => n.remove());
    [[1,1],[1,0],[0,1],[0,0]].forEach(([t,l]) => {
      const s = document.createElement('span');
      s.className = 'c'; s.textContent = '+'; s.setAttribute('aria-hidden','true');
      if (t) s.style.top = '-6px'; else s.style.bottom = '-6px';
      if (l) s.style.left = '-4px'; else s.style.right = '-4px';
      f.appendChild(s);
    });
  }
  function setup(f) {
    const src = f.getAttribute('data-src');
    if (src) {
      const img = new Image();
      img.alt = f.getAttribute('data-alt') || '';
      img.decoding = 'async';
      img.loading = 'lazy';
      img.addEventListener('load', () => {
        f.classList.remove('is-empty');
        f.classList.add('loaded');
        f.querySelectorAll('pre,.c,.tag').forEach(n => n.remove());
      });
      img.addEventListener('error', () => { img.style.display = 'none'; grain(f); }); // keep clean placeholder
      f.appendChild(img);
      img.src = src;
    }
    if (f.classList.contains('is-empty')) grain(f);
  }
  const all = () => document.querySelectorAll('.frame').forEach(setup);
  all();
  let t; window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => document.querySelectorAll('.frame.is-empty').forEach(grain), 200);
  });
})();
</script>
