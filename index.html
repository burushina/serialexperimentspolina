<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polina Burushina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>window.__errs=[];window.addEventListener('error',function(e){window.__errs.push((e.message||'error')+' @'+(e.lineno||'?'))});window.addEventListener('unhandledrejection',function(e){window.__errs.push('rej '+(e.reason&&e.reason.message||e.reason))});</script>
<style>
  :root { --ink: #ffffff; --void: #000000; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--void); color: var(--ink);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    overflow: hidden;
  }
  canvas#stage {
    position: fixed; inset: 0; z-index: 1;
    width: 100vw; height: 100vh;
    display: block;
    background: var(--void);
    touch-action: manipulation;
  }
  .overlay {
    position: fixed; z-index: 10;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
  #brand { top: 18px; left: 0; right: 0; text-align: center; font-size: 16px; line-height: 1.4; text-transform: none; }

  #readout {
    position: fixed; z-index: 9;
    left: 50%; bottom: 54px; transform: translateX(-50%);
    width: min(820px, calc(100vw - 80px));
    text-align: center; line-height: 1.5;
    background: var(--void); padding: 10px 18px;
    pointer-events: none;
  }
  #readout .re, #readout .rt { font-size: 16px; line-height: 1.4; letter-spacing: 0.04em; min-height: 1.4em; }
  #readout .rd { font-size: 16px; line-height: 1.5; margin-top: 8px; min-height: 1.5em; }
  #readout .rh {
    font-size: 11px; letter-spacing: 0.1em; text-transform: none;
    margin-top: 10px; color: rgba(255,255,255,0.55); display: none;
  }
  body.hot #readout .rh { display: block; }
  /* a project is selected: hide the experiment line, the caption becomes a link */
  #readout.sel { pointer-events: auto; cursor: pointer; }
  #readout.sel .re { display: none; }
  #readout.sel:hover .rt { text-decoration: underline; }

  @media (max-height: 760px) { #readout { bottom: 16px; } }

  @media (max-width: 760px) {
    #brand { font-size: 13px; }
    #readout { width: calc(100vw - 24px); padding: 10px 8px; }
    #readout .re, #readout .rt { font-size: 13px; }
    #readout .rd { font-size: 13px; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="brand" class="overlay">serial experiments polina</div>


<div id="readout">
  <div class="re">experiment #1: home</div>
  <div class="rt">&nbsp;</div>
  <div class="rd">&nbsp;</div>
  <div class="rh">&nbsp;</div>
</div>

<script>
/* ============================================================
   ASCII house renderer.
   Glyphs are painted onto a 2D canvas using a measured
   monospace cell grid. Window/door labels register clickable
   hit zones in canvas pixel space.
   ============================================================ */
(() => {
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const readout = document.getElementById('readout');
  const rt = readout.querySelector('.rt');
  const rd = readout.querySelector('.rd');

  const PLACES = {
    '01': { label: 'dollhouse', meta: '',
      blurb: 'a grandfather’s handmade dollhouse, rebuilt at full scale, large enough to walk into.', go: 'project-atlas.html' },
    '02': { label: 'childhood home', meta: '',
      blurb: 'a childhood home, sold after emigration. scanned and recorded before the sale.', go: 'project-house.html' },
    '03': { label: 'artist residency', meta: '',
      blurb: 'an 18th-century watermill, now an artist residency.', go: 'project-mill.html' },
    '04': { label: 'village church', meta: '',
      blurb: 'a village church and a concert that took place in it.', go: 'project-church.html' },
    '00': { label: 'about', meta: '',
      blurb: 'statement and contact.', go: 'about.html' }
  };

  const coarse = window.matchMedia('(hover: none)').matches;

  // ---- glyph matrix metrics (measured, not assumed) ----
  let cellW = 0, cellH = 0, fontPx = 0;
  let nCols = 0, nRows = 0;
  let dpr = 1;

  function pickFont() {
    const w = window.innerWidth;
    if (w <= 430) return 12;
    if (w <= 760) return 14;
    if (w <= 1200) return 16;
    return 18;
  }

  let capTop = window.innerHeight * 0.8;
  function measure() {
    if (!readout.classList.contains('sel')) capTop = readout.getBoundingClientRect().top;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    fontPx = pickFont();
    // measure one glyph in the target font
    ctx.font = fontPx + "px 'IBM Plex Mono', 'Courier New', monospace";
    const m = ctx.measureText('M');
    cellW = Math.max(1, m.width);
    cellH = Math.round(fontPx * 1.32);
    nCols = Math.floor(window.innerWidth / cellW);
    nRows = Math.floor(window.innerHeight / cellH);

    stage.width = Math.floor(window.innerWidth * dpr);
    stage.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = fontPx + "px 'IBM Plex Mono', 'Courier New', monospace";
    ctx.textBaseline = 'top';
  }

  // ---- the scene is a list of glyph placements + hit zones ----
  // Each frame we compose `cellsText` (sparse map) and `zones`.
  let zones = []; // {id, cx, cy, x0,y0,x1,y1} in pixel space
  let activeId = null; // nothing highlighted until hovered/tapped

  function blueprint() {
    // returns { stamp(col,row,ch), zone(id,col,row,len) } collector
    const glyphs = new Map(); // key "c,r" -> char
    const localZones = [];
    const api = {
      text(col, row, str) {
        for (let i = 0; i < str.length; i++) {
          const c = col + i;
          if (c >= 0 && c < nCols && row >= 0 && row < nRows) glyphs.set(c + ',' + row, str[i]);
        }
      },
      hline(c0, c1, row, ch) { for (let c = c0; c <= c1; c++) api.text(c, row, ch); },
      vline(col, r0, r1, ch) { for (let r = r0; r <= r1; r++) api.text(col, r, ch); },
      diag(c0, r0, c1, r1, ch) {
        const dc = Math.abs(c1 - c0), dr = Math.abs(r1 - r0);
        const sc = c0 < c1 ? 1 : -1, sr = r0 < r1 ? 1 : -1;
        let e = dc - dr, c = c0, r = r0;
        for (;;) {
          api.text(c, r, ch);
          if (c === c1 && r === r1) break;
          const e2 = 2 * e;
          if (e2 > -dr) { e -= dr; c += sc; }
          if (e2 < dc) { e += dc; r += sr; }
        }
      },
      label(id, col, row, str) {
        api.text(col, row, str);
        localZones.push({ id, c0: col, r: row, len: str.length });
      }
    };
    return { glyphs, localZones, api };
  }

  function composeHouse() {
    const { glyphs, localZones, api } = blueprint();

    const span = Math.min(nCols - 14, 50);
    const roofRows = 7;
    // keep the house above the caption block at the bottom
    const capRow = Math.floor(capTop / cellH) - 1;
    const bodyRows = Math.max(12, Math.min(19, capRow - 2 - roofRows));
    const left = Math.floor((nCols - span) / 2);
    const right = left + span - 1;
    const mid = Math.floor((left + right) / 2);

    let peak = Math.max(4, Math.floor((nRows - (roofRows + bodyRows)) / 2) - 3);
    peak = Math.max(2, Math.min(peak, capRow - (roofRows + bodyRows)));
    const eaves = peak + roofRows;
    const base = eaves + bodyRows;

    api.diag(left, eaves, mid, peak, '/');
    api.diag(right, eaves, mid, peak, '\\');
    api.hline(left, right, eaves, '_');
    api.vline(left, eaves + 1, base - 1, '|');
    api.vline(right, eaves + 1, base - 1, '|');
    api.hline(left, right, base, '_');

    const inTop = eaves + 1, inBot = base - 1, inH = inBot - inTop + 1;
    const fl1 = inTop + Math.floor(inH / 3);
    const fl2 = inTop + Math.floor(inH * 2 / 3);
    for (let c = left + 1; c < right; c++) {
      if (!glyphs.has(c + ',' + fl1)) api.text(c, fl1, '.');
      if (!glyphs.has(c + ',' + fl2)) api.text(c, fl2, '.');
    }

    const wL = left + Math.floor(span * 0.25);
    const wR = left + Math.floor(span * 0.75);
    // windows are video rectangles (pixel space), one per floor slot.
    // numbering bottom-up: lower row 01,02 / upper row 03,04
    const wins = [];
    // all four windows share one size: the shorter floor decides it
    const padY = Math.max(2, cellH * 0.18);
    const winH = Math.min(fl1 - inTop, fl2 - fl1 - 1) * cellH - padY * 2;
    function win(id, colCenter, r0, r1) {
      const h = winH, w = Math.round(h * 2 / 3);
      const y = ((r0 + r1 + 1) / 2) * cellH - h / 2; // centred in its floor
      const cx = (colCenter + 0.5) * cellW;
      wins.push({ id, x: Math.round(cx - w / 2), y: Math.round(y), w, h: Math.round(h) });
    }
    win('03', wL, inTop, fl1 - 1);
    win('04', wR, inTop, fl1 - 1);
    win('01', wL, fl1 + 1, fl2 - 1);
    win('02', wR, fl1 + 1, fl2 - 1);

    const dBot = base, dTop = dBot - 4;
    api.text(mid - 3, dTop,     '+----+');
    api.text(mid - 3, dTop + 1, '|    |');
    api.label('00', mid - 3, dTop + 2, '| 00 |');
    api.text(mid - 3, dTop + 3, '|    |');
    api.text(mid - 3, dBot,     '|_||_|');

    return { glyphs, localZones, wins };
  }

  // atmospheric grain — sin/jitter field over a small glyph set
  const GRAIN = ['.', ':', '\u00B7', '+', '~', '\u00B0'];
  function scatter(glyphs, t) {
    const budget = Math.floor(nCols * nRows * 0.005);
    for (let i = 0; i < budget; i++) {
      const c = (Math.random() * nCols) | 0;
      const r = (Math.random() * nRows) | 0;
      if (glyphs.has(c + ',' + r)) continue;
      const wob = Math.sin(t * 0.6 + c * 0.11 + r * 0.07);
      const g = wob > 0.55 ? '*' : GRAIN[(Math.random() * GRAIN.length) | 0];
      glyphs.set(c + ',' + r, g);
    }
  }

  // ---- window videos: small muted loops drawn into the canvas ----
  const VIDS = {
    '01': 'images/win_01_dollhouse.mp4',
    '02': 'images/win_02_childhood_home.mp4',
    '03': 'images/win_03_mill.mp4',
    '04': 'images/win_04_church.mp4'
  };
  const vids = {};
  const LOAD_ID = Date.now().toString(36);
  const vbox = document.createElement('div');
  vbox.setAttribute('aria-hidden', 'true');
  // browsers pause muted autoplay video that is invisible (opacity 0 / 1px). so the videos sit,
  // full size, at their window positions *under* the opaque canvas, which paints them.
  vbox.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none;';
  document.body.appendChild(vbox);
  Object.keys(VIDS).forEach(id => {
    const v = document.createElement('video');
    v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true;
    v.playsInline = true; v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    // Safari sometimes refuses to play a video it serves from cache after a page refresh,
    // so each page load asks for a fresh copy (the clips are tiny, ~50 KB each)
    v.preload = 'auto'; v.src = VIDS[id] + '?r=' + LOAD_ID;
    v.style.cssText = 'position:absolute;left:0;top:0;width:60px;height:90px;object-fit:cover;';
    vbox.appendChild(v);
    v.play().catch(() => {});
    vids[id] = v;
  });
  // keep them running: some phones block autoplay until a touch, some pause on their own.
  // the selected window is the only one meant to be frozen.
  const stuck = {};
  const kick = () => Object.entries(vids).forEach(([id, v]) => {
    if (!v.paused || id === activeId) { stuck[id] = 0; return; }
    stuck[id] = (stuck[id] || 0) + 1;
    if (stuck[id] >= 3) { // still paused after a few tries: reload that clip from scratch
      stuck[id] = 0;
      v.src = VIDS[id] + '?r=' + Date.now().toString(36);
      v.load();
    }
    v.play().catch(() => {});
  });
  // coming back from the back/forward cache (also some refreshes): restart everything
  window.addEventListener('pageshow', e => { if (e.persisted) kick(); });
  window.addEventListener('pointerdown', kick);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
  setInterval(() => { if (!document.hidden) kick(); }, 1500);
  function placeVideos(wins) {
    wins.forEach(r => {
      const st = vids[r.id].style;
      st.left = r.x + 'px'; st.top = r.y + 'px'; st.width = r.w + 'px'; st.height = r.h + 'px';
    });
  }
  const vReady = v => v.readyState >= 2 && v.videoWidth > 0;
  window.__vids = vids; // for the ?debug overlay

  // ---- glitch scheduler ----
  // each window: 'video' (normal) -> 'glitch' (torn frame) -> maybe 'label' ([ 03 ] shows
  // through for a moment) -> 'glitch' -> 'video'. one window at a time, at random.
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = {};
  ['01', '02', '03', '04'].forEach(id => state[id] = { mode: 'video', until: 0, then: null });
  let nextEvent = performance.now() + 2500 + Math.random() * 2500;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function schedule(now) {
    for (const id in state) {
      const st = state[id];
      if (st.mode !== 'video' && now >= st.until) {
        if (st.mode === 'glitch' && st.then === 'label') { st.mode = 'label'; st.until = now + rnd(1100, 2400); st.then = null; }
        else if (st.mode === 'label') { st.mode = 'glitch'; st.until = now + rnd(180, 380); st.then = null; }
        else { st.mode = 'video'; }
      }
    }
    if (reduceMotion || now < nextEvent) return;
    const idle = Object.keys(state).filter(id => state[id].mode === 'video' && id !== activeId);
    if (idle.length) {
      const st = state[idle[(Math.random() * idle.length) | 0]];
      st.mode = 'glitch'; st.until = now + rnd(200, 420);
      st.then = 'label';
    }
    nextEvent = now + rnd(4500, 9000);
  }

  // cover-fit source rect for a video into a w x h box
  function coverSrc(v, w, h) {
    const vw = v.videoWidth, vh = v.videoHeight, k = Math.max(w / vw, h / vh);
    const sw = w / k, sh = h / k;
    return { sx: (vw - sw) / 2, sy: (vh - sh) / 2, sw, sh, k };
  }
  function drawVideo(v, r) {
    const c = coverSrc(v, r.w, r.h);
    ctx.drawImage(v, c.sx, c.sy, c.sw, c.sh, r.x, r.y, r.w, r.h);
  }
  function drawGlitch(v, r) {
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    ctx.fillStyle = '#000'; ctx.fillRect(r.x, r.y, r.w, r.h);
    const c = coverSrc(v, r.w, r.h);
    if (Math.random() < 0.85) ctx.drawImage(v, c.sx, c.sy, c.sw, c.sh, r.x + rnd(-3, 3), r.y, r.w, r.h);
    // torn horizontal bands, shifted sideways
    const bands = 2 + ((Math.random() * 3) | 0);
    for (let i = 0; i < bands; i++) {
      const bh = Math.max(2, rnd(0.03, 0.14) * r.h), by = rnd(0, r.h - bh), dx = rnd(-0.18, 0.18) * r.w;
      ctx.drawImage(v, c.sx, c.sy + by / c.k, c.sw, bh / c.k, r.x + dx, r.y + by, r.w, bh);
      if (Math.random() < 0.25) {
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,0,90,0.22)' : 'rgba(0,220,255,0.22)';
        ctx.fillRect(r.x + dx * 0.4, r.y + by, r.w, bh);
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    // white scan lines + dropout
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 2; i++) if (Math.random() < 0.4) ctx.fillRect(r.x, r.y + rnd(0, r.h), r.w, 1);
    ctx.restore();
  }
  function drawLabel(id, r, inverse) {
    const txt = '[ ' + id + ' ]', tw = ctx.measureText(txt).width;
    const tx = Math.round(r.x + r.w / 2 - tw / 2), ty = Math.round(r.y + r.h / 2 - cellH / 2);
    if (inverse) {
      const pad = Math.max(2, cellW * 0.35);
      ctx.fillStyle = '#fff'; ctx.fillRect(tx - pad, ty, tw + pad * 2, cellH);
      ctx.fillStyle = '#000'; ctx.fillText(txt, tx, ty);
    } else {
      ctx.fillStyle = '#fff'; ctx.fillText(txt, tx, ty);
    }
    ctx.fillStyle = '#fff';
  }

  let tick = 0, scene = null;
  function compose() {
    tick++;
    scene = composeHouse();
    scatter(scene.glyphs, tick * 0.08);
    placeVideos(scene.wins);
  }
  function paint(now) {
    if (!scene) compose();
    const { glyphs, localZones, wins } = scene;
    schedule(now);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.fillStyle = '#fff';
    ctx.font = fontPx + "px 'IBM Plex Mono', 'Courier New', monospace";
    ctx.textBaseline = 'top';
    glyphs.forEach((ch, key) => {
      const [c, r] = key.split(',');
      ctx.fillText(ch, c * cellW, r * cellH);
    });

    // windows
    for (const r of wins) {
      const v = vids[r.id], st = state[r.id], ok = vReady(v);
      ctx.fillStyle = '#000'; ctx.fillRect(r.x, r.y, r.w, r.h); // clear grain under the window
      ctx.fillStyle = '#fff';
      if (activeId === r.id) { if (ok) drawVideo(v, r); drawLabel(r.id, r, true); }
      else if (!ok || st.mode === 'label') drawLabel(r.id, r, false);
      else if (st.mode === 'glitch') drawGlitch(v, r);
      else {
        drawVideo(v, r);
        if (activeId === r.id) drawLabel(r.id, r, true);
      }
    }

    // door label: stable inverse when selected
    const activeZone = activeId ? localZones.find(z => z.id === activeId) : null;
    if (activeZone) {
      const zx = activeZone.c0 * cellW, zy = activeZone.r * cellH, zw = activeZone.len * cellW;
      const pad = Math.max(2, cellW * 0.35);
      ctx.fillStyle = '#fff';
      ctx.fillRect(zx - pad, zy, zw + pad * 2, cellH);
      ctx.fillStyle = '#000';
      for (let i = 0; i < activeZone.len; i++) {
        const ch = glyphs.get((activeZone.c0 + i) + ',' + activeZone.r);
        if (ch) ctx.fillText(ch, (activeZone.c0 + i) * cellW, activeZone.r * cellH);
      }
      ctx.fillStyle = '#fff';
    }

    // pixel-space hit zones: whole window rects + the door label, padded for easy taps
    const padX = cellW * (coarse ? 1.4 : 0.6);
    const padY = cellH * (coarse ? 1.1 : 0.4);
    zones = localZones.map(z => ({
      id: z.id,
      x0: z.c0 * cellW - padX, y0: z.r * cellH - padY,
      x1: (z.c0 + z.len) * cellW + padX, y1: (z.r + 1) * cellH + padY
    })).concat(wins.map(r => ({ id: r.id, x0: r.x - 4, y0: r.y - 4, x1: r.x + r.w + 4, y1: r.y + r.h + 4 })));
  }

  let raf = null, lastGrain = 0, lastFrame = 0;
  function loop(ts) {
    if (!document.hidden) {
      if (ts - lastGrain > 130) { lastGrain = ts; compose(); }
      if (ts - lastFrame > 33) { lastFrame = ts; paint(ts); } // ~30fps for the videos
    }
    raf = requestAnimationFrame(loop);
  }

  // ---- interaction ----
  function hitAt(px, py) {
    for (const z of zones) {
      if (px >= z.x0 && px <= z.x1 && py >= z.y0 && py <= z.y1) return z.id;
    }
    return null;
  }
  const TAGLINE = 'four games built from real places';
  const rh = readout.querySelector('.rh');
  rh.textContent = '\u21B3 tap again or tap here to open';
  function setActive(id) {
    if (activeId === id) return;
    const prev = activeId; activeId = id;
    if (prev && vids[prev]) vids[prev].play().catch(() => {});       // resume the one we left
    if (id && vids[id]) { vids[id].pause(); state[id].mode = 'video'; } // freeze the chosen one
  }
  function show(id) {
    const p = PLACES[id]; if (!p) return;
    setActive(id);
    rt.textContent = id === '00' ? '[ 00 ] about \u2192' : '[ ' + id + ' ] ' + p.label + ' \u2192';
    rd.textContent = p.blurb;
    readout.classList.add('sel');
    if (coarse) document.body.classList.add('hot'); // touch only: second tap opens
  }
  // resting state: nothing selected, readout shows the experiment + tagline
  function leave() {
    setActive(null); armed = null;
    rt.textContent = TAGLINE; rd.innerHTML = '&nbsp;';
    readout.classList.remove('sel'); document.body.classList.remove('hot');
  }
  const open = id => { const p = PLACES[id]; if (p && p.go) window.location.href = p.go; };

  let armed = null, leaveT = null;
  const cancelLeave = () => { clearTimeout(leaveT); leaveT = null; };
  stage.addEventListener('pointermove', e => {
    if (coarse || stmtOpen) return;
    const id = hitAt(e.clientX, e.clientY);
    stage.style.cursor = id ? 'pointer' : 'default';
    if (id) { cancelLeave(); show(id); }
    // small grace period so the pointer can travel down to the caption and click it
    else if (activeId && !leaveT) leaveT = setTimeout(() => { leaveT = null; leave(); }, 900);
  });
  readout.addEventListener('pointerenter', cancelLeave);
  readout.addEventListener('pointerleave', () => {
    if (!coarse && activeId && !leaveT) leaveT = setTimeout(() => { leaveT = null; leave(); }, 900);
  });
  readout.addEventListener('click', () => { if (activeId) open(activeId); });
  stage.addEventListener('click', e => {
    if (stmtOpen) return;
    const id = hitAt(e.clientX, e.clientY);
    if (!id) { if (coarse) leave(); return; }
    // touch: first tap selects (frozen frame + number + caption); second tap or caption tap opens
    if (coarse && armed !== id) { show(id); armed = id; return; }
    open(id);
  });

  window.addEventListener('resize', () => { measure(); scene = null; });
  measure();
  leave();
  raf = requestAnimationFrame(loop);

  const stmtOpen = false; // statement overlay removed; text now lives on about page

  // re-measure once the web font is ready (canvas needs the real glyph metrics)
  if (document.fonts && document.fonts.ready) {
    document.fonts.load("16px 'IBM Plex Mono'").then(() => {
      document.fonts.ready.then(() => { measure(); scene = null; });
    });
  }
})();
</script>
<script>
/* ?debug overlay — independent of the main script, so it shows even if that one fails */
(function () {
  if (!/[?&]debug/.test(location.search)) return;
  var d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:6px;right:6px;top:60px;z-index:99;margin:0;font:11px/1.4 monospace;color:#0f0;background:rgba(0,0,0,.85);padding:6px;pointer-events:none;white-space:pre-wrap;';
  document.body.appendChild(d);
  function tick() {
    var out = 'DEBUG ' + navigator.userAgent.slice(0, 80) + '\n';
    var vs = window.__vids;
    if (!vs) out += 'main script did not reach videos\n';
    else Object.keys(vs).forEach(function (id) {
      var v = vs[id];
      out += id + ' rs=' + v.readyState + ' ns=' + v.networkState + ' paused=' + v.paused +
        ' t=' + v.currentTime.toFixed(1) + ' ' + v.videoWidth + 'x' + v.videoHeight +
        (v.error ? ' ERR' + v.error.code : '') + '\n';
    });
    out += 'errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none');
    d.textContent = out;
  }
  tick(); setInterval(tick, 500);
})();
</script>
