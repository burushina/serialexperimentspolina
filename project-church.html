<script>
/* Frames start with class .is-empty and a dashed grain placeholder.
   Each .frame may carry data-src (and optional data-poster). We create the
   <img>; on load we drop the placeholder (border + grain disappear); on error
   we keep the placeholder so nothing breaks visually. Drop a real folder named
   images/ next to these files and the photos appear with no frames. */
(() => {
  const G = ['.', ':', '\u00B7', '+', '~', '\u00B0'];
  function grain(f) {
    let pre = f.querySelector('pre');
    if (!pre) { pre = document.createElement('pre'); f.prepend(pre); }
    const cols = Math.max(8, Math.floor(f.clientWidth / 6.1)),
          rows = Math.max(4, Math.floor(f.clientHeight / 13.5));
    let out = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) out += Math.random() < 0.045 ? G[(Math.random()*G.length)|0] : ' ';
      out += '\n';
    }
    pre.textContent = out;
    f.querySelectorAll('.c').forEach(n => n.remove());
    [[1,1],[1,0],[0,1],[0,0]].forEach(([t,l]) => {
      const s = document.createElement('span');
      s.className = 'c'; s.textContent = '+'; s.setAttribute('aria-hidden','true');
      if (t) s.style.top = '-6px'; else s.style.bottom = '-6px';
      if (l) s.style.left = '-4px'; else s.style.right = '-4px';
      f.appendChild(s);
    });
  }
  function setup(f) {
    const src = f.getAttribute('data-src');
    if (src) {
      const img = new Image();
      img.alt = f.getAttribute('data-alt') || '';
      img.decoding = 'async';
      img.loading = 'lazy';
      img.addEventListener('load', () => {
        f.classList.remove('is-empty');
        f.classList.add('loaded');
        f.querySelectorAll('pre,.c,.tag').forEach(n => n.remove());
      });
      img.addEventListener('error', () => { img.style.display = 'none'; grain(f); }); // keep clean placeholder
      f.appendChild(img);
      img.src = src;
    }
    if (f.classList.contains('is-empty')) grain(f);
  }
  const all = () => document.querySelectorAll('.frame').forEach(setup);
  all();
  let t; window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => document.querySelectorAll('.frame.is-empty').forEach(grain), 200);
  });
})();
</script>
<script>
/* minimal text-only player for the 9:16 church video.
   click the video or [ play ] to start with sound; click the dotted
   track to jump. if the file is missing, the dashed frame just stays. */
(() => {
  const v = document.getElementById('vid'), f = document.getElementById('vframe');
  const bPlay = document.getElementById('vplay'), bMute = document.getElementById('vmute');
  const track = document.getElementById('vtrack'), time = document.getElementById('vtime');
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function cells() { // how many glyphs fit in the track
    const w = track.clientWidth, cw = parseFloat(getComputedStyle(track).fontSize) * 0.6;
    return Math.max(4, Math.floor(w / cw));
  }
  function draw() {
    const n = cells(), p = v.duration ? v.currentTime / v.duration : 0, k = Math.round(p * n);
    track.textContent = '#'.repeat(k) + '\u00B7'.repeat(n - k);
    time.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
    f.classList.toggle('playing', !v.paused && !loading);
    if (!loading) bPlay.textContent = '[ play ]';
    bMute.textContent = v.muted ? '[ unmute ]' : '[ mute ]';
  }
  // while the video is buffering, [ play ] grows dots: [ play. ] [ play.. ] [ play... ]
  let loading = false, dots = 0, dotTimer = null;
  function setLoading(on) {
    loading = on; clearInterval(dotTimer);
    if (on) {
      dots = 0;
      const tickDots = () => { dots = dots % 3 + 1; bPlay.textContent = '[ play' + '.'.repeat(dots) + ' ]'; };
      tickDots(); dotTimer = setInterval(tickDots, 400);
    }
    draw();
  }
  const toggle = () => {
    if (v.paused) { setLoading(true); v.play().catch(() => setLoading(false)); }
    else v.pause();
  };
  v.addEventListener('waiting', () => { if (!v.paused) setLoading(true); });
  v.addEventListener('playing', () => setLoading(false));
  v.addEventListener('pause', () => setLoading(false));
  v.addEventListener('error', () => setLoading(false));
  f.addEventListener('click', toggle); // the [ play ] text sits inside the frame
  const cover = new Image(); cover.onload = () => f.classList.add('ready'); cover.src = v.poster;
  bMute.addEventListener('click', () => { v.muted = !v.muted; draw(); });
  track.addEventListener('click', e => {
    if (!v.duration) return;
    const r = track.getBoundingClientRect();
    v.currentTime = ((e.clientX - r.left) / r.width) * v.duration; draw();
  });
  v.addEventListener('loadedmetadata', () => { f.classList.add('ready'); draw(); });
  ['timeupdate', 'play', 'pause', 'volumechange'].forEach(ev => v.addEventListener(ev, draw));
  v.addEventListener('ended', () => { v.load(); draw(); }); // reload shows the cover again
  if (v.readyState >= 1) f.classList.add('ready'); // metadata may already be in
  window.addEventListener('resize', draw);
  draw();
})();
</script>
